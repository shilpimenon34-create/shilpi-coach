<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D2132">
<meta name="description" content="Shilpi's personal training coach">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Shilpi's Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single phone-width app column (max 560px) with a bottom tab bar; one dark aubergine hero card per screen carries the boldness, everything else stays quiet. */
:root{
  --bg:#F5F1F3; --surface:#FFFFFF; --surface-2:#EFE8EC; --ink:#271F2B; --muted:#6E6372; --line:#E3D9DF;
  --accent:#A63D62; --accent-ink:#FFFFFF; --accent-soft:#F4DEE7;
  --hero-bg:#2D2132; --hero-ink:#F7EEF3; --hero-muted:#BFAFC4; --hero-line:#4A3A50;
  --good:#3F7559; --good-soft:#DCEBE1; --warn:#9C6A12; --warn-soft:#F6E8CB; --bad:#B03636; --bad-soft:#F6DAD8;
  --shadow:0 1px 2px rgba(39,31,43,.05),0 6px 20px rgba(39,31,43,.06);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151116; --surface:#201A22; --surface-2:#2A222D; --ink:#F2EAF0; --muted:#A99BAC; --line:#372D3B;
  --accent:#E57FA2; --accent-ink:#2A0E19; --accent-soft:#44232F;
  --hero-bg:#2B1F30; --hero-ink:#F7EEF3; --hero-muted:#B9A8BE; --hero-line:#4A3A50;
  --good:#8CC4A3; --good-soft:#1E3127; --warn:#E5B661; --warn-soft:#3A2D14; --bad:#EE8A83; --bad-soft:#3E1E1C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151116; --surface:#201A22; --surface-2:#2A222D; --ink:#F2EAF0; --muted:#A99BAC; --line:#372D3B;
  --accent:#E57FA2; --accent-ink:#2A0E19; --accent-soft:#44232F;
  --hero-bg:#2B1F30; --hero-ink:#F7EEF3; --hero-muted:#B9A8BE; --hero-line:#4A3A50;
  --good:#8CC4A3; --good-soft:#1E3127; --warn:#E5B661; --warn-soft:#3A2D14; --bad:#EE8A83; --bad-soft:#3E1E1C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 120px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.hr{height:1px;background:var(--line);margin:4px 0}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:6px}
.greet{font-size:clamp(24px,7vw,30px);font-weight:750;font-stretch:112%;letter-spacing:-.01em;line-height:1.05;margin-top:4px}
.save-chip{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
@media (max-width:400px){.save-chip .chip-x{display:none}}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .eyebrow{color:var(--hero-muted)}
.hero h2{font-size:clamp(26px,8vw,34px);font-weight:780;font-stretch:118%;line-height:1;letter-spacing:-.01em}
.hero .meta{color:var(--hero-muted);font-size:14px}
.hero .meta b{color:var(--hero-ink);font-weight:600}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;letter-spacing:.02em}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)} .pill.plain{background:var(--surface-2);color:var(--muted)}
.hero .pill.ghost{background:transparent;border:1px solid var(--hero-line);color:var(--hero-muted)}
.ring{flex:none;width:76px;height:76px;position:relative}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .lbl b{font-family:var(--f-display);font-size:24px;font-stretch:115%}
.ring .lbl span{font-size:10px;color:var(--hero-muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:650;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;padding:17px;font-size:17px;font-family:var(--f-display);font-stretch:115%;letter-spacing:.04em;text-transform:uppercase;border-radius:14px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.hero .btn.ghost{border-color:var(--hero-line);color:var(--hero-ink)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.link{background:none;padding:4px 0;color:var(--accent);font-weight:600}
.note{border-radius:12px;padding:11px 13px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--ink)} .note.bad{background:var(--bad-soft)} .note.good{background:var(--good-soft)} .note.info{background:var(--surface-2)}
.note b{font-weight:650}
.hero .note{background:rgba(255,255,255,.07);color:var(--hero-ink)}

/* lists */
.plan-list{display:flex;flex-direction:column}
.plan-item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--line)}
.plan-item:last-child{border-bottom:0}
.plan-item .nm{font-weight:600;min-width:0}
.plan-item .rx{font-variant-numeric:tabular-nums;font-size:13.5px;text-align:right;white-space:nowrap}
.plan-item .sub{font-size:12.5px;color:var(--muted);grid-column:1/-1}
.ss{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:700;color:var(--accent);margin-right:6px;font-stretch:110%}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:11px;min-width:0}
.wd .d{color:var(--muted);font-weight:600;letter-spacing:.04em}
.wd .t{font-weight:650;font-size:11px;text-align:center;line-height:1.15;overflow-wrap:anywhere}
.wd .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.wd.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dot.done{background:var(--good)} .dot.miss{background:var(--bad)} .dot.rest{background:transparent;border:1.5px solid var(--muted)} .dot.plan{background:var(--accent-soft);border:1.5px solid var(--accent)}

/* player */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.pbar .clock{font-family:var(--f-display);font-size:22px;font-weight:700;font-stretch:115%;font-variant-numeric:tabular-nums}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:10px}
.ex.complete{border-color:var(--good)}
.ex h3{font-size:18px;font-weight:720;font-stretch:108%}
.ex .rx{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pt>div{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;min-width:0}
.pt small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pt .tgt{background:var(--accent-soft)}
.cue{font-size:13.5px;margin:0;color:var(--ink);border-left:2px solid var(--accent);padding-left:10px}
.sets{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sets th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:2px 4px}
.sets td{padding:4px}
.sets input[type=number],.sets select{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px;font-size:16px;text-align:center}
.sets .n{width:34px;color:var(--muted);font-weight:650}
.sets .ck{width:52px;text-align:right}
.chk{width:42px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--surface)}
.chk svg{width:18px;height:18px;opacity:0}
.chk[aria-pressed="true"] svg{opacity:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 8px;font-size:13.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg.compact button{flex:0 0 auto}
.flag{border-radius:10px;padding:9px 11px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.flag.up{background:var(--good-soft)} .flag.hold{background:var(--warn-soft)} .flag.info{background:var(--surface-2)}
.blocks{display:flex;flex-direction:column;gap:6px}
.blk{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.blk.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.blk.done{opacity:.55}
.blk .cat{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);width:58px}
.blk .cat.cardio{color:var(--accent)} .blk .cat.pilates{color:var(--good)} .blk .cat.yoga{color:var(--warn)}
.bigtimer{font-family:var(--f-display);font-size:64px;font-weight:760;font-stretch:120%;line-height:1;font-variant-numeric:tabular-nums}
.restbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;justify-content:center;padding-inline:16px;pointer-events:none}
.restbar .in{pointer-events:auto;max-width:528px;width:100%;background:var(--hero-bg);color:var(--hero-ink);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.restbar .t{font-family:var(--f-display);font-size:28px;font-weight:760;font-stretch:118%;font-variant-numeric:tabular-nums;min-width:74px}
.restbar .bar{flex:1;height:5px;border-radius:5px;background:var(--hero-line);overflow:hidden;min-width:40px}
.restbar .bar i{display:block;height:100%;background:var(--accent)}
.restbar button{border:1px solid var(--hero-line);background:transparent;color:var(--hero-ink);border-radius:9px;padding:6px 9px;font-size:13px;font-weight:600}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);height:64px}
/* exercise demo figures */
.fig{display:block;flex:none;background:var(--surface-2);border-radius:10px}
.fg-floor{stroke:var(--line);stroke-width:1.2}
.fg-prop{fill:var(--line)} .fg-propl{stroke:var(--line);stroke-width:2;stroke-linecap:round}
.fg-pad{stroke:var(--line);stroke-width:4.5;stroke-linecap:round}
.fg-near,.fg-tor{stroke:var(--ink);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fg-far{stroke:var(--muted);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.6}
.fg-head{fill:var(--ink)}
.fg-db{fill:var(--accent)} .fg-dbbar{stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.fg-band{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:2.5 2;fill:none}
.plan-item.wf{grid-template-columns:auto 1fr auto;align-items:center}
.plan-item.wf .sub{grid-column:2/-1}
.ex-head{display:flex;gap:12px;align-items:flex-start}
.demo-big{display:flex;justify-content:center}
.demo-big .fig{width:100%;max-width:300px;height:auto}
/* cycle */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal .c{aspect-ratio:1;max-width:100%;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-variant-numeric:tabular-nums;position:relative;background:var(--surface);border:1px solid var(--line)}
.cal .c.out{visibility:hidden}
.cal .c.per{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.cal .c.pper{background:var(--accent-soft);border:1.5px dashed var(--accent);color:var(--ink)}
.cal .c.fer{background:var(--good-soft);border-color:var(--good-soft)}
.cal .c.ov{background:var(--good);color:var(--surface);border-color:var(--good);font-weight:700}
.cal .c.td{box-shadow:0 0 0 2px var(--ink)}
.cal .c i{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(20,12,22,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:22px;font-weight:760;font-stretch:112%}
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.field>.lab{font-weight:650;font-size:14px}
.field .hint{font-size:12.5px;color:var(--muted)}
.scale-lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
input[type=text],input[type=date],input[type=search],textarea,select.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;font-size:15px}
textarea{min-height:70px;resize:vertical}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-display);font-size:28px;font-weight:760;font-stretch:115%;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
.mbar{display:grid;grid-template-columns:86px 1fr 52px;gap:10px;align-items:center;font-size:13px}
.mbar .track{height:9px;background:var(--surface-2);border-radius:9px;position:relative;overflow:hidden}
.mbar .track i{position:absolute;top:0;bottom:0;left:0;background:var(--accent);border-radius:9px}
.mbar .track u{position:absolute;top:0;bottom:0;background:var(--good-soft);opacity:.9}
.mbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.lib-row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.lib-row .nm{font-weight:650}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cal-row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.cal-row.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal-row .dd{font-family:var(--f-display);font-weight:720;font-stretch:110%;line-height:1.1}
.cal-row .dd small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.cal-row .tt{min-width:0}
.cal-row .tt b{display:block;font-weight:650}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{width:46px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw[aria-pressed="true"]{background:var(--accent)}
.sw[aria-pressed="true"]::after{left:21px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:var(--r)}
details summary{cursor:pointer;font-weight:650}
.dots{letter-spacing:2px;color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="app">
  <main id="view" class="stack" aria-live="polite"></main>
</div>
<div id="restbar" class="restbar" hidden></div>
<nav class="tabs" aria-label="Sections"><div class="in" id="nav"></div></nav>
<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ============ helpers ============ */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const today=()=>ymd(new Date());
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const clone=o=>JSON.parse(JSON.stringify(o));
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate=s=>{const d=parse(s);return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`};
const mmss=sec=>{sec=Math.max(0,Math.round(sec));return `${Math.floor(sec/60)}:${pad(sec%60)}`};
const uid36=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

}
let state=defaultState(), logs=[], active=null;
function migrate(s){

  s.settings.equipment=Object.assign(defaultState().settings.equipment,s.settings.equipment||{});
  s.settings.cycle=Object.assign(defaultCycle(),s.settings.cycle||{});

}
const Store={
  mode:'local',db:null,uid:null,chain:Promise.resolve(),timer:null,
  loadLocal(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch(e){return null}},
  loadActive(){try{return JSON.parse(localStorage.getItem(LS_KEY+'.active')||'null')}catch(e){return null}},
  saveActive(){try{active?localStorage.setItem(LS_KEY+'.active',JSON.stringify(active)):localStorage.removeItem(LS_KEY+'.active')}catch(e){}},
  saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({state,logs}))}catch(e){}},
  async connect(){
    if(!window.claude||typeof window.claude.use!=='function') return;
    try{
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(!db||!user) return;
      const id=await user.id(); if(!id) return;
      this.db=db; this.uid=id;
      const snap=await db.collection('data/users/'+id).get();
      let rs=null; const rl=[];
      snap.docs.forEach(d=>{if(d.id==='state') rs=d.data(); else if(d.id.indexOf('log-')===0) rl.push(clone(d.data()))});
      const remoteIds=new Set(rl.map(l=>l.id));
      const localOnly=logs.filter(l=>!remoteIds.has(l.id));
      if(rs){ state=migrate(clone(rs)); logs=rl.concat(localOnly).sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id)); }
      this.mode='db';
      if(!rs) await this.pushState();
      for(const l of localOnly) this.pushLog(l);
      this.saveLocal();
      planWeek(); render();
    }catch(e){console.warn('db connect failed',e); this.db=null; this.mode='local'; render();}
  },
  scheduleState(){this.saveLocal(); if(!this.db) return; clearTimeout(this.timer); this.timer=setTimeout(()=>this.pushState(),700)},
  pushState(){ if(!this.db) return; const body=clone(state); this.chain=this.chain.then(()=>this.db.doc(`data/users/${this.uid}/state`).set(body)).catch(e=>this.fail(e)); return this.chain },
  pushLog(l){ this.saveLocal(); if(!this.db) return; const body=clone(l); this.chain=this.chain.then(()=>this.db.doc(`data/users/${this.uid}/log-${l.id}`).set(body)).catch(e=>this.fail(e)); return this.chain },
  async wipe(){
    if(this.db){ try{ for(const l of logs) await this.db.doc(`data/users/${this.uid}/log-${l.id}`).delete(); await this.db.doc(`data/users/${this.uid}/state`).delete(); }catch(e){console.warn(e)} }
    try{localStorage.removeItem(LS_KEY);localStorage.removeItem(LS_KEY+'.active')}catch(e){}
  },
  fail(e){ console.warn('save failed',e); if(e&&e.code==='invalid_argument'){this.db=null;this.mode='readonly'} else this.mode='error'; render(); }
};
function save(){Store.scheduleState()}

/* ============ rules: equipment, blocks, cycle ============ */
function equipSet(){
  if(state.settings.travel) return {band:true,mat:true};
  return state.settings.equipment;
}
function equipOK(ex){const have=equipSet();return ex.equip.every(g=>g.split('|').some(k=>have[k]))}
function usable(id){const ex=LIB[id];return ex&&equipOK(ex)&&!state.avoid[id]&&ex.back<2&&(state.caution[id]||0)<2}
function affects(id,area){if(!area||area==='other')return false;const ex=LIB[id];return ex.stress.includes(area)||(area==='lowBack'&&ex.back>=1)}
function blockInfo(d){
  if(state.deloadWeek&&state.deloadWeek<mondayOf(d)){state.settings.startDate=addDays(state.deloadWeek,7);state.deloadWeek=null;save()}
  const mon=mondayOf(d); const w=Math.max(0,Math.floor(daysBetween(state.settings.startDate,mon)/7));
  const blockWeek=(w%6)+1, blockIdx=Math.floor(w/6);
  return {blockWeek,blockIdx,deload:blockWeek===6||state.deloadWeek===mon,early:state.deloadWeek===mon};
}
/* ---- cycle engine ---- */
const HORMONAL=c=>c.contraception==='pill'||c.contraception==='lng';
function cycStats(){
  const c=state.settings.cycle;
  const hist=[...new Set((c.history||[]).concat(c.lastStart?[c.lastStart]:[]))].filter(Boolean).sort();
  const diffs=[]; for(let i=1;i<hist.length;i++){const d=daysBetween(hist[i-1],hist[i]); if(d>=18&&d<=50) diffs.push(d)}
  const recent=diffs.slice(-6);
  const avg=recent.length?sum(recent)/recent.length:null;
  const len=recent.length>=2?Math.round(avg):clamp(+c.length||28,21,45);
  const sd=recent.length>=3?Math.sqrt(sum(recent.map(x=>(x-avg)**2))/recent.length):null;
  const spread=sd!=null?Math.max(1,Math.round(sd)):({regular:2,varies:4,irregular:7,unsure:4})[c.regularity]||3;
  const pl=hist.filter(h=>c.ends&&c.ends[h]).map(h=>daysBetween(h,c.ends[h])+1).filter(x=>x>=1&&x<=12);
  const periodLen=pl.length?Math.round(sum(pl)/pl.length):clamp(+c.periodLen||5,2,10);
  const luteal=clamp(+c.luteal||14,10,16);
  return {hist,diffs:recent,len,sd,spread,periodLen,luteal,last:hist[hist.length-1]||null,fromHistory:recent.length>=2};
}
function phaseForDay(day,len,periodLen,luteal){
  const ov=Math.max(periodLen+2,len-luteal);
  if(day<=periodLen) return 'menstrual';
  if(day<ov-1) return 'follicular';
  if(day<=ov+1) return 'ovulatory';
  if(day>len-5) return 'lateLuteal';
  return 'luteal';
}
function predictedStarts(n){
  const st=cycStats(), t=today(); if(!st.last) return [];
  let next=addDays(st.last,st.len); const overdue=next<=t&&daysBetween(st.last,t)>=st.len;
  if(overdue) next=addDays(t,1);
  const out=[]; for(let i=0;i<n;i++) out.push(addDays(next,i*st.len));
  return out;
}
function cycleInfo(d){
  const c=state.settings.cycle; if(!c.track||!c.setup||HORMONAL(c)) return null;
  const st=cycStats(); if(!st.last) return null;
  const n=daysBetween(st.last,d); if(n<0) return null;
  const day=n+1;
  if(day>st.len) return {day,phase:'lateLuteal',len:st.len,late:day-st.len};
  return {day,phase:phaseForDay(day,st.len,st.periodLen,st.luteal),len:st.len};
}
// calendar classification of any date
function cycleDayClass(d){
  const c=state.settings.cycle, st=cycStats();
  for(const h of st.hist){ const end=c.ends&&c.ends[h]?c.ends[h]:addDays(h,st.periodLen-1); if(d>=h&&d<=end) return 'per'; }
  if(!st.last||d<=today()&&d<st.last) return '';
  const starts=[st.last].concat(predictedStarts(14));
  let S=null; for(const s of starts){ if(s<=d) S=s; }
  if(!S) return '';
  const day=daysBetween(S,d)+1, predicted=S!==st.last;
  if(predicted&&day<=st.periodLen) return 'pper';
  if(HORMONAL(c)) return '';
  const ov=Math.max(st.periodLen+2,st.len-st.luteal);
  if(day===ov) return 'ov';
  if(day>=ov-5&&day<=ov+1) return 'fer';
  return '';
}
function periodStarted(d){
  const c=state.settings.cycle; c.history=[...new Set((c.history||[]).concat(c.lastStart?[c.lastStart]:[],[d]))].sort();
  c.lastStart=c.history[c.history.length-1]; save();
}
function periodEnded(d){const c=state.settings.cycle, st=cycStats(); if(st.last&&d>=st.last){c.ends=c.ends||{};c.ends[st.last]=d;save()}}
const PHASEN={menstrual:'Menstrual',follicular:'Follicular',ovulatory:'Ovulatory',luteal:'Luteal',lateLuteal:'Late luteal',none:'Not tracking'};
// Green cutoff: an ordinary day (sleep OK, energy 3, soreness 2, stress 2 = 3.45) is green; anything lower is amber.
const GREEN=3.4;
function readinessFrom(c){
  let s=0.25*c.sleep+0.3*c.energy+0.25*(6-c.soreness)+0.2*(6-c.stress);
  if(c.phase==='menstrual'&&c.energy<=3) s-=0.3;
  if(c.phase==='lateLuteal') s-=0.2;
  if(c.prevHard) s-=0.2;
  s=clamp(Math.round(s*10)/10,1,5);

const TIER={green:{lbl:'Ready to progress',cls:'good'},amber:{lbl:'Trim the volume',cls:'warn'},red:{lbl:'Recovery day',cls:'bad'}};

/* ============ weekly planner ============ */
function canonical(){return state.settings.strengthDays===3?['L1','PZ','U1','YR','L2','PC']:['L1','PZ','U1','YR','L2','F1']}

function logsOn(d){return logs.filter(l=>l.date===d)}
function adj(a,b){
  const ra=REG(a),rb=REG(b); if(!ra||!rb) return 0;
  if(ra===rb) return ra==='lower'?20:ra==='upper'?12:15;
  if(ra==='full'||rb==='full') return (ra==='lower'||rb==='lower')?6:5;
  return 1;
}
function seqScore(seq,dates,prevT,prevDate,canon){
  let s=0,pt=prevT,pd=prevDate,run=REG(prevT)?1:0;
  seq.forEach((ty,i)=>{
    const d=dates[i]; const consec=daysBetween(pd,d)===1;
    if(consec) s+=adj(pt,ty);
    run=REG(ty)?(consec?run+1:1):0; if(run>=3) s+=6;
    pt=ty; pd=d;
  });

}

function typeDoneOn(d){const l=logsOn(d).slice(-1)[0]; if(l) return l.type; const p=state.days[d]&&state.days[d].plan; return p==='REST'?'REST':'NONE'}
function planWeek(){
  const t=today(), week=weekDates(t), rest=+state.settings.restDay, canon=canonical();
  const isRest=d=>parse(d).getDay()===rest;
  const need=canon.slice(); const satisfy=ty=>{const i=need.indexOf(ty);if(i>=0)need.splice(i,1)};
  logs.filter(l=>l.date>=week[0]&&l.date<=week[6]).forEach(l=>satisfy(l.type));
  const tDay=state.days[t]||{}; const loggedToday=logsOn(t).length>0;
  const fixed=loggedToday||!!tDay.checkin;
  if(tDay.checkin&&!loggedToday) satisfy(sessionTypeFor(t));
  const start=fixed?addDays(t,1):t;
  const free=week.filter(d=>d>=start&&!isRest(d));
  let items=need.slice();
  if(items.length>free.length){items.sort((a,b)=>PRIORITY.indexOf(a)-PRIORITY.indexOf(b));items=items.slice(0,free.length)}

  const prevDate=addDays(start,-1), prevT=fixed&&!loggedToday?sessionTypeFor(t):typeDoneOn(prevDate);
  // hard rule: never the same region (lower/upper/full) on consecutive days
  const clash=seq=>{let pt=prevT,pd=prevDate;return seq.some((ty,i)=>{const hit=REG(ty)&&REG(ty)===REG(pt)&&daysBetween(pd,free[i])===1;pt=ty;pd=free[i];return hit})};
  let best=null, bs=Infinity; const dropped=[];
  for(;;){
    permutations(items).forEach(p=>{if(clash(p)) return;const s=seqScore(p,free,prevT,prevDate,canon);if(s<bs){bs=s;best=p}});
    if(best) break;

    const drop=items.filter(REG).sort((a,b)=>PRIORITY.indexOf(b)-PRIORITY.indexOf(a))[0];
    items[items.indexOf(drop)]='OPT'; dropped.push(drop);
  }
  const moved=[];

  week.forEach(d=>{if(isRest(d)) state.days[d]=Object.assign(state.days[d]||{},{plan:'REST'})});
  if(!state.days[t]||!state.days[t].plan) state.days[t]=Object.assign(state.days[t]||{},{plan:isRest(t)?'REST':'OPT'});
  const missed=week.filter(d=>d<t&&isMissed(d));
  if(dropped.length) state.weekNote={week:week[0],text:`${dropped.map(x=>TYPES[x].title).join(' and ')} ${dropped.length>1?'are':'is'} left out this week: the remaining days would have trained the same muscles two days running.`};
  else if(moved.length) state.weekNote={week:week[0],text:missed.length?`Rearranged the rest of the week after ${missed.map(d=>DOWL[parse(d).getDay()]).join(' and ')}'s missed session, so no muscle group is loaded two days running.`:'Shifted the rest of the week to keep hard sessions for the same muscles apart.'};

function isMissed(d){const p=state.days[d]&&state.days[d].plan; if(!p||p==='REST'||p==='OPT') return false; return d<today()&&logsOn(d).length===0}

/* ============ session building ============ */
function ctxFor(d){
  const day=state.days[d]||{}, b=blockInfo(d), c=day.checkin;
  const ctx={tier:'green',score:null,painArea:null,painLevel:'none',deload:b.deload,blockIdx:b.blockIdx,blockWeek:b.blockWeek,checked:!!c,phase:c?c.phase:null,swaps:day.swaps||{}};
  if(c){const r=readinessFrom(c);ctx.tier=r.tier;ctx.score=r.score;ctx.painArea=c.pain==='none'?null:c.painArea;ctx.painLevel=c.pain}
  return ctx;
}
function sessionTypeFor(d){
  const day=state.days[d]||{}; const plan=day.plan||'OPT'; const ctx=ctxFor(d);
  if(!ctx.checked||plan==='REST') return plan;
  if(ctx.painLevel==='sharp') return 'MR';
  if(ctx.tier==='red'&&(TYPES[plan].kind==='strength'||plan==='PZ'||plan==='PC')) return 'MR';
  return plan;
}
function chooseSlot(type,slot,ctx){
  if(ctx.swaps[type+'.'+slot.key]&&LIB[ctx.swaps[type+'.'+slot.key]]&&equipOK(LIB[ctx.swaps[type+'.'+slot.key]])) return ctx.swaps[type+'.'+slot.key];
  const ov=state.slot[type+'.'+slot.key];
  if(ov&&LIB[ov]&&equipOK(LIB[ov])&&!state.avoid[ov]) return ov;
  const allowed=slot.opts.filter(usable);
  if(!allowed.length){const pat=LIB[slot.opts[0]].pattern;const alt=Object.values(LIB).find(e=>e.pattern===pat&&usable(e.id));return alt?alt.id:null}
  return slot.role==='A'?allowed[ctx.blockIdx%allowed.length]:allowed[0];
}
function painAlt(id,slot,area){
  const pool=slot.opts.concat(LIB[id].subs,Object.keys(LIB).filter(k=>LIB[k].pattern===LIB[id].pattern));
  return pool.find(k=>k!==id&&usable(k)&&!affects(k,area))||null;
}
const ROLE={P:{sets:3,rest:90,rpe:[7,8]},S:{sets:3,rest:75,rpe:[7,8]},A:{sets:3,rest:45,rpe:[8,9]}};
function workSec(it){const ex=LIB[it.id];const per=ex.time?(it.lo+it.hi)/2:3.5*(it.lo+it.hi)/2;return (per+10)*(ex.uni?2:1)}
function estimate(items){
  let t=240+180; const done=new Set();
  items.forEach((it,i)=>{
    if(done.has(i)) return; t+=45;
    const mate=it.ss?items.findIndex((o,j)=>j!==i&&o.ss===it.ss):-1;
    if(mate>-1){done.add(mate);const m=items[mate];const rounds=Math.max(it.sets,m.sets);t+=rounds*(workSec(it)+workSec(m)+15+60)}
    else t+=it.sets*(workSec(it)+it.rest);
  });
  return t;
}
function fitBudget(items,budget){
  let guard=0;
  while(estimate(items)>budget&&guard++<20){
    // trim accessories, then secondaries, then drop an accessory; main lift keeps its 3 sets unless nothing else is left
    let cut=false;
    for(const r of ['A','S']){ for(let i=items.length-1;i>=0;i--){ if(items[i].role===r&&items[i].sets>2){items[i].sets--;cut=true;break} } if(cut) break; }
    if(!cut){ const i=items.map(x=>x.role).lastIndexOf('A'); if(i>=0){items.splice(i,1);cut=true} }
    if(!cut){ const p=items.find(x=>x.role==='P'&&x.sets>2); if(p){p.sets--;cut=true} }
    if(!cut) break;
  }
}
function roundDown(ex,x){return Math.max(ex.inc,Math.floor(x/ex.inc)*ex.inc)}
function nextLoad(ex,load){if(ex.unit==='band') return Math.min(BANDS.length-1,load+1); if(ex.unit==='bw') return null; return Math.round((load+ex.inc)*100)/100}
function fmtLoad(ex,load){
  if(ex.unit==='bw') return ex.id==='sl_hip_thrust'||ex.id==='pushup'?'bodyweight':'bodyweight';
  if(ex.unit==='band') return (BANDS[load]||BANDS[1])+' band';

function repsTxt(ex,r){return r.join('/')+(ex.time?' s':'')}
function targetFor(id,sets,lo,hi,ctx){

  const resize=a=>{const r=a.slice(0,sets);while(r.length<sets) r.push(r[r.length-1]||lo);return r};
  if(ctx.deload){ if(ex.unit==='kg'&&load) load=roundDown(ex,load*0.9); reps=fill(lo); flag='deload' }
  else if(st.suggestReset&&ex.unit==='kg'){ load=roundDown(ex,load*0.9); reps=fill(lo); flag='reset' }
  else if(st.pendingIncrease&&ctx.tier==='green'&&ex.unit!=='bw'&&!ex.time&&nextLoad(ex,load)!==load){ flag='up'; reps=fill(lo); }
  else if(st.pendingIncrease&&ex.time&&ctx.tier==='green'){ reps=fill(Math.min(hi,lo)); load=ex.unit==='kg'?nextLoad(ex,load):load; flag='up' }
  else if(st.lastSets){ const last=resize(st.lastSets); reps=ctx.tier==='green'?last.map(r=>clamp(r+1,lo,hi)):last.map(r=>clamp(r,lo,hi)); if(st.pendingIncrease) flag='held'; if(ex.unit==='bw'&&st.pendingIncrease&&ctx.tier==='green') flag='harder' }

function buildSession(type,ctx){
  const T=TYPES[type];

  if(T.kind==='timed'){const blocks=timedBlocks(type,ctx);return {type,kind:'timed',title:T.title,goal:T.goal,blocks,est:Math.round(sum(blocks.map(b=>b.sec))/60),notes:timedNotes(type,ctx)}}

    const ex=LIB[id], R=ROLE[slot.role];

  });
  if(ctx.tier==='amber') items.forEach(it=>{if(it.role!=='P') it.sets=Math.max(2,it.sets-1); it.rpe=it.rpe.map(x=>x-1)});
  if(ctx.deload) items.forEach(it=>{it.sets=Math.max(2,it.sets-1); it.rpe=[6,7]});
  fitBudget(items,38*60);
  const ssCount={};
  items.forEach(it=>{ if(it.ss&&items.filter(o=>o.ss===it.ss).length>1){ssCount[it.ss]=(ssCount[it.ss]||0)+1; it.label=it.ss+ssCount[it.ss]} else {it.ss=null;it.label=null} it.target=targetFor(it.id,it.sets,it.lo,it.hi,ctx) });
  return {type,kind:'strength',title:T.title,goal:T.goal,warm:WARM[T.warm],cool:COOL[T.region==='lower'?'lower':'upper'],items,swaps,est:Math.round(estimate(items)/60)};
}

function weekLogs(d){const w=weekDates(d);return logs.filter(l=>l.date>=w[0]&&l.date<=w[6])}
function e1rm(load,reps){return load*(1+reps/30)}
function bestSet(sets,ex){
  let best=null;
  sets.filter(s=>s.done).forEach(s=>{const v=ex.unit==='kg'?e1rm(+s.load||0,+s.reps||0):(+s.reps||0);if(!best||v>best.v) best={v,load:+s.load||0,reps:+s.reps||0}});
  return best;
}
function streak(){
  const t=today(); let n=0; let d=logsOn(t).length?t:addDays(t,-1);
  for(let i=0;i<400;i++){
    const p=state.days[d]&&state.days[d].plan; const done=logsOn(d).length>0;
    if(done||p==='REST'||p==='OPT') n++; else break;
    if(!p&&!done) break;
    d=addDays(d,-1);
  }
  return n;
}
const MGROUP={glutes:'Glutes',quads:'Quads',adductors:'Quads',hamstrings:'Hamstrings',back:'Back',shoulders:'Shoulders',chest:'Chest',biceps:'Arms',triceps:'Arms',core:'Core'};
const MTARGET={Glutes:[10,16],Quads:[6,12],Hamstrings:[6,10],Back:[9,14],Shoulders:[6,12],Chest:[3,8],Arms:[4,10],Core:[6,12]};
function muscleSets(ls){
  const m=Object.fromEntries(Object.keys(MTARGET).map(k=>[k,0]));
  ls.forEach(l=>{
    (l.exercises||[]).forEach(e=>{const ex=LIB[e.id];if(!ex)return;const n=e.sets.filter(s=>s.done).length;ex.muscles.forEach((mu,i)=>{const g=MGROUP[mu];if(g) m[g]+=n*(i===0?1:0.5)})});
    if(l.minutes&&l.minutes.pilates>=8){m.Core+=3;m.Glutes+=2}
  });
  return m;
}
function suggestDeload(){
  const t=today(); const b=blockInfo(t); if(b.deload||b.blockWeek<3) return null;
  const recent=Object.keys(state.days).filter(d=>d<=t&&d>addDays(t,-7)&&state.days[d].checkin).map(d=>readinessFrom(state.days[d].checkin).score);
  const stalls=Object.keys(state.ex).filter(k=>(state.ex[k].stall||0)>=2).length;
  if(recent.length>=3&&sum(recent)/recent.length<2.6) return 'Your readiness has averaged under 2.6 this week.';
  if(stalls>=3) return `${stalls} exercises have stalled for two sessions or more.`;
  return null;
}

/* ============ logging & progression ============ */
function processLog(log){
  const out=[]; const c=log.checkin||{};
  (log.exercises||[]).forEach(it=>{
    const ex=LIB[it.id]; if(!ex) return;
    const st=state.ex[it.id]=state.ex[it.id]||{};
    const done=it.sets.filter(s=>s.done); if(!done.length) return;
    const load=ex.unit==='bw'?null:(+done[0].load||0);
    const reps=done.map(s=>+s.reps||0);
    const total=sum(reps);
    const sameLoad=st.load===load||(st.load==null&&load==null);
    const prevTotal=st.lastSets&&sameLoad?sum(st.lastSets.slice(0,reps.length)):null;
    const allTop=done.length>=it.sets.length&&reps.every(r=>r>=it.hi);
    const painFlag=it.pain||(log.pain&&log.pain.level==='sharp')||(log.pain&&log.pain.level==='mild'&&affects(it.id,log.pain.area));
    let note;
    if(painFlag){ st.topStreak=0; st.pendingIncrease=false; state.caution[it.id]=(state.caution[it.id]||0)+1;
      note=state.caution[it.id]>=2?'Discomfort reported twice, so this exercise is swapped out of future sessions.':'Discomfort reported. Load held; it will be swapped if it happens again.'; }
    else if(log.deload){ note='Deload session: no progression change.'; }
    else if(allTop){
      // only clean (non-max) sessions count toward the 2 needed; a max-effort session never triggers an increase
      const clean=it.effort!=='max'?1:0;
      st.topStreak=sameLoad?(st.topStreak||0)+clean:clean;
      const ready=it.effort==='easy'||(st.topStreak>=2&&clean);
      if(!ready) st.pendingIncrease=false;
      if(ready&&ex.unit!=='bw'){ st.pendingIncrease=true; const nx=ex.time?`${it.lo} s with ${fmtLoad(ex,nextLoad(ex,load))}`:fmtLoad(ex,nextLoad(ex,load)); note=`Top of the range (${repsTxt(ex,reps)}). Next time: ${nx}.`; }
      else if(ready){ st.pendingIncrease=true; note=`Top of the range (${repsTxt(ex,reps)}). Make it harder next time: slower lowering or the harder variation.`; }
      else note=it.effort==='max'?'Top of the range, but it felt like a max effort. Holding the load until it feels repeatable.':'Top of the range. One more clean session here before adding load.';
      st.stall=0;
    } else {
      st.topStreak=0;
      if(!sameLoad) st.pendingIncrease=false;
      if(prevTotal!=null&&total<=prevTotal&&!log.deload) st.stall=(st.stall||0)+1; else st.stall=0;
      if(prevTotal==null) note=sameLoad?`Baseline set: ${repsTxt(ex,reps)}${load!=null?' @ '+fmtLoad(ex,load):''}.`:`First session at ${fmtLoad(ex,load)}: ${repsTxt(ex,reps)}. Build reps from here.`;
      else if(total>prevTotal) note=`+${total-prevTotal} ${ex.time?'seconds':'reps'} vs last time.`;
      else note='Matched or slightly below last time.';
      if(st.stall>=2){
        const why=stallContext(it.id,c,log);
        note+=' '+(why||'Recovery looked normal. Holding the load and aiming for one more rep on the last set.');
        if(st.stall>=3&&!why&&ex.unit==='kg'){st.suggestReset=true;note+=' Next session drops 10% to rebuild momentum.'}
      }
    }
    if(st.suggestReset&&!painFlag&&it.target&&it.target.flag==='reset') st.suggestReset=false;
    st.load=load; st.lastSets=reps; st.lastDate=log.date; st.lastEffort=it.effort;
    const b=bestSet(it.sets,ex); const pr=state.prs[it.id];
    if(b&&b.v>0&&(!pr||b.v>pr.v+0.01)){ if(pr) out.push({pr:true,text:`New best on ${ex.name}: ${ex.unit==='kg'?b.load+' kg × '+b.reps:b.reps+(ex.time?' s':' reps')}`}); state.prs[it.id]={v:b.v,load:b.load,reps:b.reps,date:log.date} }
    out.push({id:it.id,name:ex.name,text:note});
  });
  return out;
}
function stallContext(id,c,log){
  const why=[];
  const cks=Object.values(state.days).map(d=>d.checkin).filter(Boolean);
  if(cks.length>=3){
    const avg=k=>sum(cks.map(x=>x[k]))/cks.length;
    if(c.sleep&&c.sleep<avg('sleep')-0.6) why.push(`sleep was below your usual (${c.sleep} vs ${avg('sleep').toFixed(1)})`);
    if(c.stress&&c.stress>avg('stress')+0.6) why.push('stress was higher than usual');
    if(c.energy&&c.energy<avg('energy')-0.6) why.push('energy was lower than usual');
  }
  if(c.phase==='lateLuteal'||c.phase==='menstrual') why.push(`you were in the ${PHASEN[c.phase].toLowerCase()} phase, when the same weight often feels heavier`);
  if(log.rpe>=9) why.push('the whole session felt very hard');
  if(!why.length) return '';
  return `Not a program failure: ${why.join(', ')}. Holding the load; no change needed.`;
}

  if(ctx.deload&&sess.kind==='strength') n.push('Deload week: fewer sets, about 10% lighter, effort around RPE 6–7.');

    ${flag}
    <p class="cue">${esc(ex.cue)}</p>
    <table class="sets"><thead><tr><th>Set</th><th>${ex.unit==='band'?'Band':ex.unit==='bw'?'Load':'kg'}</th><th>${ex.time?'Seconds':'Reps'}</th><th class="ck">Done</th></tr></thead><tbody>
    ${it.log.map((s,j)=>`<tr><td class="n">${j+1}</td>${loadCell(s,j)}<td><input type="number" inputmode="numeric" min="0" id="r-${i}-${j}" data-in="reps" data-i="${i}" data-j="${j}" value="${s.reps}"></td><td class="ck"><button class="chk" data-act="set" data-i="${i}" data-j="${j}" aria-pressed="${s.done}" aria-label="Set ${j+1} done">${ICON.check}</button></td></tr>`).join('')}
    </tbody></table>

    <div class="row">${it.pain?`<span class="pill bad">Discomfort noted</span><button class="btn link small" data-act="pain" data-arg="${i}">Undo</button>`:`<button class="btn link small" data-act="pain" data-arg="${i}">This hurt (not muscle burn)</button>`}</div>
  </article>`;
}
/* ---- timed player ---- */

/* ---- week ---- */
function viewWeek(){
  const t=today(), wk=weekDates(t), b=blockInfo(t), canon=canonical();
  const rest=+state.settings.restDay; const train=wk.filter(d=>parse(d).getDay()!==rest); const canonMap={}; train.forEach((d,i)=>canonMap[d]=canon[i]);
  const rows=wk.map(d=>{
    const p=(state.days[d]&&state.days[d].plan)||null; const l=logsOn(d).slice(-1)[0]; const T=TYPES[l?l.type:p]||null;
    let chip;
    if(l) chip=`<span class="pill good">Done · ${l.durationMin}m</span>`;
    else if(isMissed(d)) chip='<span class="pill bad">Missed</span>';
    else if(p==='REST') chip='<span class="pill plain">Rest</span>';
    else if(d===t) chip='<span class="pill accent">Today</span>';
    else if(!p) chip='<span class="pill plain">–</span>';
    else chip='<span class="pill plain">Planned</span>';
    const movedTxt=!l&&p&&d>=t&&canonMap[d]&&p!==canonMap[d]&&p!=='OPT'?'<span class="small muted">Rescheduled</span>':'';
    const dd=parse(d);
    return `<div class="cal-row ${d===t?'today':''}"><div class="dd">${DOW[dd.getDay()]}<small>${dd.getDate()} ${MON[dd.getMonth()]}</small></div><div class="tt"><b>${T?esc(T.title):'Not planned'}</b><span class="small muted">${T?esc(T.goal):'App not yet in use'}</span> ${movedTxt}</div>${chip}</div>`;
  }).join('');
  const blockRow=[1,2,3,4,5,6].map(w=>`<div style="flex:1;text-align:center"><div style="height:8px;border-radius:4px;background:${w<b.blockWeek?'var(--accent)':w===b.blockWeek?'var(--accent)':'var(--surface-2)'};opacity:${w<b.blockWeek?.45:1}"></div><div class="small ${w===b.blockWeek?'':'muted'}" style="margin-top:4px">${w===6?'Deload':'W'+w}</div></div>`).join('');
  return `<header class="topbar"><div><div class="eyebrow">${fmtDate(wk[0])} – ${fmtDate(wk[6])}</div><h1 class="greet">This week</h1></div></header>
  <section class="stack" style="gap:8px">${rows}</section>
  <section class="card stack"><div class="spread"><h3 style="font-size:17px">Block ${b.blockIdx+1} · week ${b.blockWeek} of 6</h3>${b.deload?'<span class="pill warn">Deload</span>':''}</div><div class="row" style="flex-wrap:nowrap;gap:6px">${blockRow}</div>
  <p class="small muted" style="margin:0">Weeks 1–5 build with double progression; week 6 is a lighter deload. Accessory exercises rotate each block; your main lifts stay so progress can be measured.</p></section>
  <section class="card stack"><h3 style="font-size:17px">How your week adapts</h3>
  <div class="small">• A missed session is never stacked on top of the next one. The remaining days are re-planned so the same muscles are never trained hard two days in a row, and the lowest-priority session is dropped if the week runs out of days.</div>
  <div class="small">• Priority when days run short: Lower · Glutes, Upper, Lower · Legs, Pilates + Zone 2, Full Body, Yoga.</div>
  <div class="small">• ${DOWL[rest]} is your rest day and is never used for catch-up.</div></section>`;
}

/* ---- progress ---- */
function viewProgress(){
  const t=today(), wl=weekLogs(t);
  const planned=weekDates(t).filter(d=>{const p=state.days[d]&&state.days[d].plan;return p&&p!=='REST'&&p!=='OPT'}).length;
  const doneN=new Set(wl.map(l=>l.date)).size;

  const py=wl.filter(l=>l.minutes&&((l.minutes.pilates||0)+(l.minutes.yoga||0))>=8).length;
  const vol=Math.round(sum(wl.map(l=>l.volume||0)));
  const ms=muscleSets(wl);
  const recent=[...Array(14)].map((_,i)=>addDays(t,i-13)).map(d=>state.days[d]&&state.days[d].checkin?readinessFrom(state.days[d].checkin).score:null);
  const lastR=recent.filter(x=>x!=null).slice(-1)[0];

  const weeks=[...Array(8)].map((_,i)=>addDays(mondayOf(t),(i-7)*7)).map(m=>({m,v:sum(logs.filter(l=>l.date>=m&&l.date<=addDays(m,6)).map(l=>l.volume||0))}));

  <section class="tiles">
    <div class="tile"><b>${streak()}</b><span>Day streak on plan</span></div>
    <div class="tile"><b>${doneN}<small style="font-size:16px;color:var(--muted)">/${planned}</small></b><span>Sessions this week</span></div>
    <div class="tile"><b>${cardio}</b><span>Cardio minutes</span></div>
    <div class="tile"><b>${py}</b><span>Pilates / yoga sessions</span></div>
  </section>
  <section class="card stack"><div class="spread"><h3 style="font-size:17px">Recovery</h3>${lastR?`<span class="pill ${TIER[readinessFrom(state.days[Object.keys(state.days).filter(d=>state.days[d].checkin).sort().pop()].checkin).tier].cls}">Last check-in ${lastR}/5</span>`:''}</div>
  ${recent.some(x=>x!=null)?sparkline(recent):'<div class="empty">Readiness from your daily check-ins will chart here.</div>'}<div class="small muted">Readiness, last 14 days. ${GREEN}+ means progress as planned; under 2.6 means a recovery day.</div></section>
  <section class="card stack"><div class="spread"><h3 style="font-size:17px">Muscle groups this week</h3><span class="small muted">sets · target band</span></div>
  ${Object.entries(MTARGET).map(([g,[lo,hi]])=>{const v=ms[g];const max=Math.max(hi*1.4,v);return `<div class="mbar"><span>${g}</span><div class="track"><u style="left:${lo/max*100}%;width:${(hi-lo)/max*100}%"></u><i style="width:${Math.min(100,v/max*100)}%;${v>hi?'background:var(--warn)':''}"></i></div><span class="v num">${Math.round(v*10)/10}</span></div>`}).join('')}
  <div class="small muted">Shaded band is the weekly target. Bars past the band turn amber, a cue not to add more to that area.</div></section>
  <section class="card stack"><div class="spread"><h3 style="font-size:17px">Strength progression</h3>${kgEx.length?`<select class="inp" id="chartEx" data-in="chartEx" style="width:auto;max-width:60%;padding:6px 8px;font-size:13px">${kgEx.map(id=>`<option value="${id}" ${id===ui.chartEx?'selected':''}>${esc(LIB[id].name)}</option>`).join('')}</select>`:''}</div>

  <section class="card stack"><h3 style="font-size:17px">Personal records</h3>${prs.length?prs.map(([id,p])=>`<div class="spread"><span style="font-weight:600">${esc(LIB[id]?LIB[id].name:id)}</span><span class="num small">${LIB[id]&&LIB[id].unit==='kg'?`${p.load} kg × ${p.reps}`:`${p.reps}${LIB[id]&&LIB[id].time?' s':' reps'}`} <span class="muted">· ${fmtDate(p.date)}</span></span></div>`).join(''):'<div class="empty">Your best set on each exercise appears here.</div>'}</section>
  <section class="card stack"><h3 style="font-size:17px">Recent sessions</h3>${logs.length?logs.slice(-8).reverse().map(l=>`<div class="spread"><div><div style="font-weight:600">${esc(l.title)}</div><div class="small muted">${fmtDate(l.date)} · ${l.durationMin} min · RPE ${l.rpe}</div></div><span class="pill ${l.completed==='yes'?'good':l.completed==='partial'?'warn':'plain'}">${l.completed==='yes'?'Done':l.completed==='partial'?'Partial':'Skipped'}</span></div>`).join(''):'<div class="empty">No sessions yet. Your first one is on the Today tab.</div>'}</section>`;

function sparkline(vals){
  const W=320,H=70,P=6; const pts=vals.map((v,i)=>v==null?null:[P+i*(W-2*P)/(vals.length-1),H-P-(v-1)/4*(H-2*P)]);
  const seg=pts.filter(Boolean); if(!seg.length) return '';
  const y=v=>H-P-(v-1)/4*(H-2*P);
  const path=seg.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=seg[seg.length-1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Readiness trend"><line x1="${P}" x2="${W-P}" y1="${y(GREEN)}" y2="${y(GREEN)}" stroke="var(--good)" stroke-dasharray="3 4" stroke-width="1"/><line x1="${P}" x2="${W-P}" y1="${y(2.6)}" y2="${y(2.6)}" stroke="var(--warn)" stroke-dasharray="3 4" stroke-width="1"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>${seg.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--accent)"/>`).join('')}<circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></svg></div>`;
}
function strengthChart(id){
  const ex=LIB[id];
  const pts=logs.filter(l=>(l.exercises||[]).some(e=>e.id===id)).map(l=>{const e=l.exercises.find(x=>x.id===id);const b=bestSet(e.sets,ex);return b?{d:l.date,v:b.v,load:b.load,reps:b.reps}:null}).filter(Boolean);
  if(!pts.length) return '<div class="empty">No logged sets yet.</div>';
  const W=320,H=170,L=34,R=12,T=14,B=26;
  const vs=pts.map(p=>p.v); let lo=Math.floor(Math.min(...vs)*0.9), hi=Math.ceil(Math.max(...vs)*1.08); if(hi-lo<4){hi+=2;lo=Math.max(0,lo-2)}
  const x=i=>pts.length===1?(L+W-R)/2:L+i*(W-L-R)/(pts.length-1), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const ticks=[lo,Math.round((lo+hi)/2),hi];
  const line=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=line+` L${x(pts.length-1).toFixed(1)} ${H-B} L${x(0).toFixed(1)} ${H-B} Z`;
  const lp=pts[pts.length-1], fp=pts[0];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ex.name)} estimated strength">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join('')}
    <path d="${area}" fill="var(--accent-soft)" opacity=".7"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?4.5:2.6}" fill="var(--accent)" ${i===pts.length-1?'stroke="var(--surface)" stroke-width="2"':''}/>`).join('')}
    <text x="${x(0)}" y="${H-8}" text-anchor="${pts.length===1?'middle':'start'}">${fmtDate(fp.d)}</text>${pts.length>1?`<text x="${x(pts.length-1)}" y="${H-8}" text-anchor="end">${fmtDate(lp.d)}</text>`:''}
  </svg></div><div class="small muted">Estimated 1-rep max (kg, Epley formula) from your best set each session. Latest best set: <b class="num" style="color:var(--ink)">${lp.load} kg × ${lp.reps}</b>.</div>`;
}
function volChart(weeks){
  const W=320,H=120,L=8,R=8,T=10,B=22; const max=Math.max(...weeks.map(w=>w.v))||1; const bw=(W-L-R)/weeks.length;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly volume">

    ${weeks.map((w,i)=>{const h=(w.v/max)*(H-T-B);const last=i===weeks.length-1;return `<rect x="${L+i*bw+bw*0.18}" y="${H-B-h}" width="${bw*0.64}" height="${Math.max(h,w.v?2:0)}" rx="3" fill="${last?'var(--accent)':'var(--accent-soft)'}"/><text x="${L+i*bw+bw/2}" y="${H-7}" text-anchor="middle">${parse(w.m).getDate()} ${MON[parse(w.m).getMonth()]}</text>`}).join('')}
  </svg></div>`;
}

function cycleFlags(st){
  const f=[];
  if(st.diffs.length>=3){
    if(st.diffs.some(x=>x<21)||st.diffs.some(x=>x>35)) f.push('Some logged cycles are shorter than 21 days or longer than 35 days.');
    if(st.sd!=null&&st.sd>7) f.push('Cycle length is varying by more than a week.');
  }
  if(st.periodLen>7) f.push('Periods are averaging more than 7 days.');
  if(!f.length) return '';
  return `<div class="note warn"><div><b>Worth mentioning to a gynaecologist.</b> ${f.join(' ')} Occasional variation is common, but a consistent pattern like this is worth a check-up.</div></div>`;
}

function swapCandidates(id){

}

  const c=swapCandidates(it.id).filter(x=>reason!=='discomfort'||x.back<2);
  return `<div class="spread"><h2>Swap ${esc(e.name)}</h2><button class="btn sm ghost" data-act="close">Close</button></div>
  <div class="field"><span class="lab">Why?</span>${seg('r',[['equipment','No equipment today'],['dislike',"Don't like it"],['discomfort','It causes discomfort'],['travel','Travelling']],reason,'swapreason')}
  <span class="hint">${reason==='dislike'?'It will be avoided from now on.':reason==='discomfort'?'The replacement is used in future sessions too.':'Just for today.'}</span></div>
  <div class="card" style="padding-block:4px">${c.length?c.map(x=>`<button class="lib-row" data-act="doswap" data-arg="${x.id}"><div class="row" style="flex-wrap:nowrap;min-width:0;align-items:center">${fig(x.id,48)}<div style="min-width:0"><div class="nm">${esc(x.name)}</div><div class="small muted">${PATTERNS[x.pattern]} · ${x.muscles.map(m=>MUSN[m]).join(', ')}</div></div></div>${x.back>=2?'<span class="pill warn">Heavy spinal load</span>':x.pattern===e.pattern?'<span class="pill good">Same pattern</span>':'<span class="pill plain">Similar muscles</span>'}</button>`).join(''):'<div class="empty">No alternative fits your equipment. Try switching equipment on in Settings.</div>'}</div>`;
}

/* ---- rest timer ---- */
function renderRest(){
  const el=$('#restbar');
  if(!rest){el.hidden=true;return}
  const left=Math.max(0,(rest.endsAt-Date.now())/1000);
  if(!el.firstChild||el.hidden){el.hidden=false;el.innerHTML=`<div class="in"><span class="t" id="rt">${mmss(left)}</span><div style="flex:1;min-width:0"><div class="small" style="color:var(--hero-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Rest · ${esc(rest.label)}</div><div class="bar"><i id="rb" style="width:${left/rest.total*100}%"></i></div></div><button data-act="rest15">+15 s</button><button data-act="restskip">Skip</button></div>`}
  else {$('#rt').textContent=mmss(left);$('#rb').style.width=(left/rest.total*100)+'%'}
}
function beep(){try{if(!audioCtx) return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;g.gain.value=0.12;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.35)}catch(e){} try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
setInterval(()=>{
  const el=$('#elapsed'); if(el&&active) el.textContent=mmss((Date.now()-active.startedAt)/1000);
  if(rest){ if(Date.now()>=rest.endsAt){rest=null;beep();$('#restbar').hidden=true;$('#restbar').innerHTML=''} else renderRest(); }
},250);
// Timed blocks count from the clock, not interval ticks, so a locked/backgrounded phone catches up on return.
function tickTimed(){
  if(!active||active.kind!=='timed'||!active.running) return false;
  const now=Date.now(); if(!active.tickAt){active.tickAt=now;return false}
  let secs=Math.floor((now-active.tickAt)/1000); if(secs<=0) return false;
  active.tickAt+=secs*1000;
  let advanced=false;
  while(secs>0&&active.running){
    const b=active.blocks[active.idx]; if(!b){active.running=false;break}
    const take=Math.min(secs,active.remaining);
    active.remaining-=take; active.spent[b.cat]=(active.spent[b.cat]||0)+take; secs-=take;
    if(active.remaining<=0){advanced=true;active.idx++;const nb=active.blocks[active.idx];if(nb) active.remaining=nb.sec;else active.running=false}
  }
  return advanced;
}
setInterval(()=>{
  if(!active||active.kind!=='timed'||!active.running) return;
  if(tickTimed()){beep();Store.saveActive();render();return}
  const bt=$('#btimer'); if(bt) bt.textContent=mmss(active.remaining);
  if(active.remaining%15===0) Store.saveActive();
},1000);

/* ============ actions ============ */
function startWorkout(){
  const t=today(), ctx=ctxFor(t), type=sessionTypeFor(t), s=buildSession(type,ctx);
  if(s.kind==='rest') return;
  try{if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wakeLock=w).catch(()=>{})}catch(e){}
  active={date:t,type,kind:s.kind,title:s.title,startedAt:Date.now(),ctx:{tier:ctx.tier,deload:ctx.deload},notes:s.kind==='strength'?adaptNotes(ctx,type,s).slice(0,2):s.notes};
  if(s.kind==='strength'){
    Object.assign(active,{warm:s.warm,cool:s.cool,warmDone:{},warmOpen:true,items:s.items.map(it=>({...it,effort:'right',pain:false,declined:false,log:it.target.reps.map(r=>({load:LIB[it.id].unit==='bw'?'':it.target.load,reps:r,done:false}))}))});
  } else Object.assign(active,{blocks:s.blocks,idx:0,remaining:s.blocks[0]?s.blocks[0].sec:0,running:false,spent:{}});
  Store.saveActive(); render(); window.scrollTo(0,0);
}
function openCheckin(){
  const t=today(), prev=state.days[t]&&state.days[t].checkin, cy=cycleInfo(t);
  ui.ck=prev?clone(prev):{sleep:3,energy:3,soreness:2,stress:2,pain:'none',painArea:'lowBack',phase:cy?cy.phase:'none',missAns:'skip'};
  ui.sheet='checkin'; render();
}
function saveCheckin(){
  const t=today(), c=ui.ck, last=logs.slice(-1)[0];
  const miss=lastMissed();
  if(miss){ state.days[miss].answered=true; if(c.missAns==='did'){ const l={id:uid36(),date:miss,type:state.days[miss].plan,title:TYPES[state.days[miss].plan].title,kind:TYPES[state.days[miss].plan].kind,durationMin:0,completed:'yes',rpe:7,pain:{level:'none'},notes:'Logged from check-in (details not recorded)',unlogged:true,exercises:[],minutes:{},volume:0}; logs.push(l); Store.pushLog(l);} }
  c.prevHard=!!(last&&(c.prevFeel==='hard'||(!c.prevFeel&&last.rpe>=9))&&daysBetween(last.date,t)<=1);
  if(state.settings.cycle.track===false) c.phase='none';
  state.days[t]=Object.assign(state.days[t]||{},{checkin:clone(c)});
  ui.sheet=null; planWeek(); render(); window.scrollTo(0,0);
}
function finishSave(){
  const a=active, f=ui.fin, t=a.date;
  const log={id:uid36(),date:t,type:a.type,title:a.title,kind:a.kind,startedAt:a.startedAt,durationMin:Math.max(1,Math.round((Date.now()-a.startedAt)/60000)),completed:f.completed,rpe:f.rpe,pain:{level:f.pain,area:f.pain==='none'?null:f.painArea},notes:f.notes,deload:!!a.ctx.deload,tier:a.ctx.tier,checkin:state.days[t]&&state.days[t].checkin?clone(state.days[t].checkin):null,minutes:{},volume:0,exercises:[]};
  if(a.kind==='strength'){
    log.exercises=a.items.map(it=>({id:it.id,role:it.role,lo:it.lo,hi:it.hi,sets:it.log.map(s=>({load:s.load===''?null:+s.load,reps:+s.reps||0,done:!!s.done})),effort:it.effort,pain:it.pain,target:{flag:it.declined?null:it.target.flag,load:it.target.load}}));
    log.volume=sum(log.exercises.map(e=>LIB[e.id].unit==='kg'&&!LIB[e.id].time?sum(e.sets.filter(s=>s.done).map(s=>(s.load||0)*s.reps*(LIB[e.id].uni?2:1))):0));
    log.minutes={strength:log.durationMin};
  } else {
    const m={}; Object.entries(a.spent).forEach(([k,v])=>m[k]=Math.round(v/60)); log.minutes=m;
    log.durationMin=Math.max(1,Math.round(sum(Object.values(a.spent))/60))||log.durationMin;
  }
  log.decisions=processLog(log);
  logs.push(log); active=null; rest=null; Store.saveActive();
  try{wakeLock&&wakeLock.release()}catch(e){}
  ui.sheet=null; planWeek(); Store.pushLog(log); render(); window.scrollTo(0,0); toast('Session saved');
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, arg=b.dataset.arg;
  if(act==='backdrop'){ if(e.target===b){ui.sheet=null;render()} return }
  try{if(!audioCtx&&(act==='set'||act==='tplay'||act==='start')) audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(err){}
  switch(act){
    case 'tab': setTab(arg); break;
    case 'checkin': openCheckin(); break;
    case 'ck': ui.ck[b.dataset.k]=isNaN(+arg)?arg:+arg; renderSheet(); break;
    case 'periodtoday': periodStarted(today()); ui.ck.phase='menstrual'; renderSheet(); break;
    case 'export': {
      try{const blob=new Blob([JSON.stringify({app:'shilpi-coach',v:1,exported:new Date().toISOString(),state,logs},null,1)],{type:'application/json'});
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`coach-backup-${today()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Backup downloaded')}catch(err){toast('Export failed on this browser')}
      break; }
    case 'gocycle': ui.sheet=null; setTab('cycle'); break;
    case 'perstart': periodStarted(today()); render(); toast('Period start logged'); break;
    case 'perend': periodEnded(today()); render(); toast('Period end logged'); break;
    case 'cyother': ui.cyOther=!ui.cyOther; render(); break;
    case 'cyostart': if(ui.cyOdate||today()){periodStarted(ui.cyOdate||today());ui.cyOther=false;render();toast('Period start logged')} break;
    case 'cyoend': { const d=ui.cyOdate||today(); const st=cycStats(); if(st.last&&d>=st.last){periodEnded(d);ui.cyOther=false;render();toast('Period end logged')} else toast('Pick a date after the latest period start'); break; }
    case 'cymonth': ui.cyMonth=arg; render(); break;
    case 'cylog': { const c=state.settings.cycle, t=today(); c.log=c.log||{}; const l=c.log[t]=c.log[t]||{flow:'none',sym:[]}; l.flow=arg; if(['light','medium','heavy'].includes(arg)&&cycleDayClass(t)!=='per'&&!(cycStats().last&&daysBetween(cycStats().last,t)<10)) periodStarted(t); save(); render(); break; }
    case 'cysym': { const c=state.settings.cycle, t=today(); c.log=c.log||{}; const l=c.log[t]=c.log[t]||{flow:'none',sym:[]}; l.sym=l.sym||[]; const i=l.sym.indexOf(arg); i>=0?l.sym.splice(i,1):l.sym.push(arg); save(); render(); break; }
    case 'cyedit': ui.cyEdit=true; ui.cy=null; ui.cyErr=null; render(); window.scrollTo(0,0); break;
    case 'cycancel': ui.cyEdit=false; ui.cy=null; ui.cyErr=null; render(); break;
    case 'cyset': { const k=b.dataset.k; ui.cy[k]=arg==='true'?true:arg==='false'?false:isNaN(+arg)?arg:+arg; render(); break; }
    case 'cytrack': ui.cy.track=!ui.cy.track; render(); break;
    case 'cysave': {
      const d=ui.cy, t=today();
      if(!d.lastStart||d.lastStart>t){ui.cyErr='Add the first day of your most recent period (not a future date).';render();break}
      const len=parseInt(d.length,10);
      if(d.lengthKnown&&(!len||len<18||len>50)){ui.cyErr='Cycle length should be between 18 and 50 days. Choose "Not sure" if you don\'t know.';render();break}
      const c=state.settings.cycle;
      const past=d.past.filter(p=>p&&p<d.lastStart);
      Object.assign(c,{setup:true,track:d.track,lastStart:d.lastStart,length:d.lengthKnown?len:28,lengthKnown:d.lengthKnown,periodLen:d.periodLen,regularity:d.regularity,contraception:d.contraception,luteal:d.lutealKnown?clamp(parseInt(d.luteal,10)||14,10,16):14,lutealKnown:d.lutealKnown});
      c.history=[...new Set((c.history||[]).filter(h=>h<d.lastStart).concat(past,[d.lastStart]))].sort();
      ui.cyEdit=false; ui.cy=null; ui.cyErr=null; save(); render(); window.scrollTo(0,0); toast('Cycle tracker set up'); break; }
    case 'cksave': saveCheckin(); break;
    case 'start': startWorkout(); break;
    case 'close': ui.sheet=null; render(); break;
    case 'warm': active.warmDone[arg]=!active.warmDone[arg]; Store.saveActive(); render(); break;
    case 'set': {
      const i=+b.dataset.i,j=+b.dataset.j,it=active.items[i],s=it.log[j]; s.done=!s.done;
      if(s.done){ const mate=it.ss?active.items.findIndex((o,k)=>k!==i&&o.ss===it.ss):-1; const restNow=mate<0||i>mate; const secs=mate>-1?60:it.rest; if(restNow||mate<0) rest={endsAt:Date.now()+secs*1000,total:secs,label:(j+1<it.log.length?`next: set ${j+2} of ${LIB[it.id].name}`:'next exercise')}; }
      Store.saveActive(); render(); break; }
    case 'effort': active.items[+b.dataset.i].effort=arg; Store.saveActive(); render(); break;
    case 'pain': { const it=active.items[+arg]; it.pain=!it.pain; Store.saveActive(); render(); if(it.pain) toast('Noted. Stop this exercise if it hurts; use Swap for an alternative.'); break; }
    case 'decline': { const it=active.items[+arg]; it.declined=true; const from=it.target.upFrom!=null?it.target.upFrom:it.target.prevLoad; it.log.forEach(s=>{if(!s.done) s.load=from}); const st=state.ex[it.id]||{}; it.log.forEach((s,k)=>{if(!s.done&&st.lastSets) s.reps=clamp(st.lastSets[k]||it.lo,it.lo,it.hi)}); Store.saveActive(); render(); break; }
    case 'swap': ui.sheet='swap'; ui.arg=+arg; ui.swapReason='equipment'; render(); break;
    case 'swapreason': ui.swapReason=arg; renderSheet(); break;
    case 'doswap': {
      const i=ui.arg, it=active.items[i], key=active.type+'.'+it.slotKey, r=ui.swapReason;
      if(r==='dislike'){state.avoid[it.id]=true;state.slot[key]=arg}
      else if(r==='discomfort'){state.caution[it.id]=(state.caution[it.id]||0)+1;state.slot[key]=arg}
      else {const d=state.days[active.date]=state.days[active.date]||{};d.swaps=Object.assign(d.swaps||{},{[key]:arg})}
      save();
      const ex=LIB[arg]; const tg=targetFor(arg,it.sets,ex.lo,ex.hi,ctxFor(active.date));
      active.items[i]=Object.assign({},it,{id:arg,lo:ex.lo,hi:ex.hi,target:tg,declined:false,pain:false,effort:'right',log:tg.reps.map((rr,k)=>({load:ex.unit==='bw'?'':tg.load,reps:rr,done:false}))});
      ui.sheet=null; Store.saveActive(); render(); toast(`Swapped to ${ex.name}`); break; }
    case 'info': ui.sheet='info'; ui.arg=arg; render(); break;
    case 'avoid': state.avoid[arg]=!state.avoid[arg]; if(!state.avoid[arg]) delete state.avoid[arg]; save(); render(); break;
    case 'clearcaution': delete state.caution[arg]; save(); render(); break;
    case 'finish': ui.fin=ui.fin&&ui.fin.forStart===active.startedAt?ui.fin:{forStart:active.startedAt,completed:'yes',rpe:7,pain:'none',painArea:'lowBack',notes:''}; ui.sheet='finish'; render(); break;
    case 'fin': ui.fin[b.dataset.k]=isNaN(+arg)?arg:+arg; renderSheet(); break;
    case 'finsave': finishSave(); break;
    case 'discard': if(b.dataset.sure){active=null;rest=null;Store.saveActive();render()} else {b.dataset.sure='1';b.textContent='Tap again to discard';} break;
    case 'tplay': tickTimed(); active.running=!active.running; active.tickAt=Date.now(); Store.saveActive(); render(); break;
    case 'tnext': tickTimed(); active.tickAt=Date.now(); active.idx++; { const nb=active.blocks[active.idx]; if(nb) active.remaining=nb.sec; else active.running=false; } Store.saveActive(); render(); break;
    case 'rest15': if(rest){rest.endsAt+=15000;rest.total+=15} break;
    case 'restskip': rest=null; $('#restbar').hidden=true; $('#restbar').innerHTML=''; break;
    case 'libpat': ui.libPat=arg; render(); break;
    case 'sdays': state.settings.strengthDays=+arg; planWeek(); render(); break;
    case 'restday': state.settings.restDay=+arg; Object.keys(state.days).forEach(d=>{if(d>=today()&&!logsOn(d).length&&!(state.days[d].checkin)) delete state.days[d].plan}); planWeek(); render(); break;
    case 'travel': state.settings.travel=!state.settings.travel; save(); render(); break;
    case 'equip': state.settings.equipment[arg]=!state.settings.equipment[arg]; save(); render(); break;
    case 'cycle': state.settings.cycle.track=!state.settings.cycle.track; save(); render(); break;
    case 'deload': state.deloadWeek=mondayOf(today()); save(); render(); toast('This week is now a deload week'); break;
    case 'reset1': ui.confirmReset=true; render(); break;
    case 'reset0': ui.confirmReset=false; render(); break;
    case 'reset2': Store.wipe().then(()=>{state=defaultState();logs=[];active=null;ui.confirmReset=false;planWeek();render();toast('All data deleted')}); break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target, k=el.dataset&&el.dataset.in; if(!k) return;
  if(k==='load'||k==='reps'){ const s=active.items[+el.dataset.i].log[+el.dataset.j]; s[k]=el.value; Store.saveActive(); }
  else if(k==='libq'){ ui.libQ=el.value; const pos=el.selectionStart; render(); const n=$('#libq'); n.focus(); try{n.setSelectionRange(pos,pos)}catch(err){} }
  else if(k==='finnotes') ui.fin.notes=el.value;
  else if(k==='cyf'&&ui.cy) ui.cy[el.dataset.k]=el.value;
  else if(k==='cypast'&&ui.cy) ui.cy.past[+el.dataset.i]=el.value;
  else if(k==='cyodate') ui.cyOdate=el.value;
  else if(k==='name'){ state.settings.name=el.value; save(); }
  else if(k==='cylen'){ state.settings.cycle.length=clamp(parseInt(el.value)||28,21,40); save(); }
});
document.addEventListener('change',e=>{
  const el=e.target, k=el.dataset&&el.dataset.in; if(!k) return;
  if(k==='load'&&el.tagName==='SELECT'){ const s=active.items[+el.dataset.i].log[+el.dataset.j]; s.load=+el.value; Store.saveActive(); }
  else if(k==='import'&&el.files&&el.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{try{const j=JSON.parse(fr.result); if(!j||!j.state||!Array.isArray(j.logs)) throw 0; state=migrate(j.state); logs=j.logs; active=null; Store.saveActive(); Store.saveLocal(); planWeek(); render(); toast(`Backup restored: ${logs.length} sessions`)}catch(err){toast("That file isn't a Coach backup")} el.value=''};
    fr.readAsText(el.files[0]);
  }
  else if(k==='chartEx'){ ui.chartEx=el.value; render(); }
  else if(k==='cystart'){ state.settings.cycle.lastStart=el.value; save(); render(); }
  else if(k==='blkstart'&&el.value){ state.settings.startDate=mondayOf(el.value); save(); render(); }
  else if(k==='cylen'){ render(); }
});

/* ============ boot ============ */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
(function boot(){
  const loc=Store.loadLocal();
  if(loc&&loc.state){state=migrate(loc.state);logs=Array.isArray(loc.logs)?loc.logs:[]}
  const act=Store.loadActive(); if(act&&act.date===today()) active=act;
  planWeek(); render();
  Store.connect();
})();
</script>
